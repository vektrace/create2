[package]
name = "create2"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Paul Juranitsch-Klauser <contact@vektrace.com>"]
description = "Rust library for controlling iRobot Create 2 robots"
license = "MIT"
repository = "https://github.com/vektrace/create2"
keywords = ["create2", "irobot", "robotics"]
categories = ["hardware-support", "robotics"]
exclude = ["/.github"]

[dependencies]
thiserror = "2.0.21"

[dev-dependencies]
serialport = "4.10.1"
anyhow = "1.0.105"
